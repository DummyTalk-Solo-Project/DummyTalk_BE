# ─── 로그 레벨 ───────────────────────────────────────────────────────────────
# 부하 측정에서 로그가 CPU 를 먹는 것이 실측으로 드러나 정리했다.
#   200rps 회차에서 logback_events_total 이 초당 3,066건 (debug 1.82K + info 1.50K).
#   원인 ① org.hibernate.SQL=DEBUG 로 모든 쿼리를 출력  ② 요청당 info 6건(JWT·인터셉터·뽑기·천장).
#   CPU(system) 가 99% 로 벽에 닿은 상태라 이 비용이 측정 결과를 직접 흔든다.
# 대응: 요청당 로그는 코드에서 debug 로 내리고, 아래 레벨은 env 로 다시 켤 수 있게 남긴다.
#   LOG_LEVEL_SQL=DEBUG  → 쿼리 확인(N+1·조인 점검)이 필요할 때만
#   LOG_LEVEL_APP=DEBUG  → 부하 경로 동작 추적이 필요할 때만 (회차 측정 중에는 INFO 유지)
logging:
  level:
    org.hibernate.SQL: ${LOG_LEVEL_SQL:OFF}
    DummyTalk.DummyTalk_BE: ${LOG_LEVEL_APP:INFO}


server:
  tomcat:
    mbeanregistry:
      enabled: true

spring:
  # 요청 처리 스레드 모델 — V3(플랫폼 스레드) vs V4(Virtual Thread) 를 가르는 축.
  # VirtualThreadConfig 가 이 값을 @ConditionalOnProperty 로 따라가므로 .env 만 바꾸면 전환된다(재배포 불필요).
  # ⚠️ 이 값은 Tomcat 요청 executor 만 바꾼다. AsyncConfig 의 badge/mail VT executor 와
  #    SchedulerConfig 의 VT 스케줄러는 4개 회차 내내 고정 — 뽑기마다 발행되는 DummyViewedEvent 를
  #    플랫폼 풀(core 3 / max 10 / queue 50)로 되돌리면 200rps 에서 큐가 넘쳐 RejectedExecution 이 쏟아지고,
  #    그건 "요청 스레드 모델" 비교와 무관한 잡음이기 때문이다. 단일 변수만 움직이려는 의도적 선택.
  threads:
    virtual:
      enabled: ${VIRTUAL_THREADS:true}

  application:
    name: DummyTalk_BE

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST}:5432/${DB_NAME} # PostgreSQL 용
#    url: jdbc:mysql://${DB_HOST}:3306/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

    # Stage 4 CP 스윕: HIKARI_POOL_SIZE 환경변수로 재배포(이미지 재빌드) 없이 컨테이너 재시작만으로 풀 크기 조정
    # 기본값 10 = Stage 1~4 기존 테스트와 동일 baseline
    hikari:
      maximum-pool-size: ${HIKARI_POOL_SIZE:10}
      minimum-idle: ${HIKARI_POOL_SIZE:10} # HikariCP 권장: 버스트 부하는 풀 확장 오버헤드 없는 고정 풀(minimumIdle=maximumPoolSize)이 유리
  #      connection-timeout: 10000 # 빠른 거절 실험 — CP 크기 확정 후 별도 실험 (지금은 기본 30s 유지)
#      idle-timeout: 300000 # 5분 이후에는 반납
#      max-lifetime: 1200000 # < PostgreSQL TCP keepalive
#      keepalive-time: 60000  # 1m 마다 connection 확인 (Timeout 대비)

  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
        use_sql_comments: true
        default_batch_fetch_size: 1000
        jdbc:
          batch_size: 50
    show-sql: false

  data:
    elasticsearch:
      repositories:
        enabled: true
      url: ${ES_URL}

    redis:
      host: ${REDIS_HOST}
      port: 6379

  sql:
    init:
      mode: never

  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: true

  mail:
    host: ${MAIL_SENDER_HOST}
    port: 587
    username: ${MAIL_SENDER_USERNAME}
    password: ${MAIL_SENDER_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enabled: true
      auth-code-expiration-millis: 300000

  ai:
    openai:
      api-key: ${OPENAI_KEY}
      chat:
        options:
          model: gpt-4-turbo
          temperature: 0.7

jwt:
  secret:
    key: ${JWT_SECRET_KEY}

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus

  # http_server_requests_seconds_bucket 노출 — 기본은 count/sum/max 만 나가서 분위수 계산 불가
  # K6 teardown 이 회차 전후 버킷 델타로 서버측 p95/p99 를 구하고(RTT 제외), Grafana histogram_quantile 도 이 버킷이 전제
  # 버킷 개수만큼 시계열이 늘어나지만(엔드포인트당 수십 개) 측정 서버 규모에선 무시 가능
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
        # 커넥션 획득 대기 분포 — 포화 순서의 DB 축 (Grafana "HikariCP acquire p95" 패널 전제)
        hikaricp.connections.acquire: true

  health:
    elasticsearch:
      enabled: false

discord:
  webhook:
    url: ${DISCORD_WEBHOOK}

# K6 테스트용 더미 유저 적재 (TestMemberDataLoader) + Admin 부하테스트 API(/api/admin/load-test/*) 게이트
# false(기본값) = 비활성, true = 앱 기동 시 test1~N@test.com 자동 생성 + load-test API 활성
# EC2 시딩 방법은 TestMemberDataLoader.java 주석 참고
test:
  load-users: true
  # 유저 수 = open model 동시 활성 유저 = RATE × INTERVAL (300rps × 5s = 1500). 시딩은 멱등이라 늘려서 재기동만 하면 됨
  load-users-count: ${TEST_LOAD_USERS_COUNT:300}

# ─── getDummy() 동시성 전략 K6 비교 설정 ──────────────────────────────────────
# 전부 env 치환이라 .env 3줄만 바꾸고 `docker compose up -d spring`(40초) 하면 전환된다.
# 이미지 재빌드·재배포 불필요. 서버가 실제로 어떤 조합으로 떠 있는지는
# GET /api/admin/load-test/state 로 확인할 것 (회차 결과 파일 헤더에도 자동 기록된다).
#
# ⚠️ 축이 둘이다. 예전 주석에는 "스레드 모델" 축이 빠져 있어 V3 인 줄 알고 VT 가 켜진 채 측정한 적이 있다.
#
#  회차 | GETDUMMY_VERSION | INTERCEPTOR_ENABLED | VIRTUAL_THREADS | 전략
#  -----|------------------|---------------------|-----------------|------------------------------------
#  V1   | 1                | false               | false           | 순수 @Transactional (동시성 보호 없음)
#  V2   | 2                | false               | false           | + @DistributedLock(waitTime=0)
#  V3   | 3                | true                | false           | + IdempotentRequestInterceptor(SETNX)
#  V4   | 3                | true                | true            | + Virtual Thread (요청 처리 스레드)
concurrency:
  getDummy-version: ${GETDUMMY_VERSION:3}       # 1 = V1(순수트랜잭션) / 2 = V2(분산락) / 3 = V3·V4(인터셉터, default)
  interceptor-enabled: ${INTERCEPTOR_ENABLED:true} # false = V1/V2 측정 시 인터셉터 미등록 (WebConfig 에서 분기)

# prod 프로파일 없이 배포 환경에서 Swagger 비활성화
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false