# /var/lib/grafana/dashboards 아래 JSON 을 자동 로드 (파일 수정 시 30s 내 반영)
# 부하테스트 대시보드는 레포(docker/grafana/dashboards/)에서 관리 — UI 에서 고친 뒤엔 JSON export 로 되돌려 커밋할 것
apiVersion: 1

providers:
  - name: dummytalk
    folder: DummyTalk
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
