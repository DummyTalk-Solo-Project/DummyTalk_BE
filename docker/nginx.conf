# Cloudflare Proxy ON, Full (Strict)
server {
    listen 80;
    server_name ddotg.dev;
    # HTTP → HTTPS 리디렉션 (Cloudflare "Always Use HTTPS")
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name ddotg.dev;

    # Cloudflare Origin Certificate
    ssl_certificate     /etc/ssl/cloudflare/cert.pem;
    ssl_certificate_key /etc/ssl/cloudflare/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    location / {
        # Docker 내장 DNS(127.0.0.11)로 매 요청마다 spring의 IP를 재조회.
        # 변수 없이 proxy_pass에 호스트명을 직접 쓰면 Nginx 시작 시 IP를 캐싱해버려서,
        # spring 컨테이너를 재시작(예: CP 스윕 실험용 --force-recreate)하면 IP가 바뀌어도
        # Nginx가 옛 IP로 계속 요청해 502가 남 (CP 스윕 중 재현됨).
        resolver           127.0.0.11 valid=10s;
        set $spring_upstream spring:8080;
        proxy_pass         http://$spring_upstream;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
    }
}
