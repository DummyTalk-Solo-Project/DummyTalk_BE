services:
  nginx:
    image: nginx:alpine
    container_name: DummyTalk_Nginx
    ports:
      - "80:80"
      - "443:443"  # Cloudflare Full (Strict)
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro # SCP로 EC2 ~/dummytalk/docker/ 에 복사
      - /etc/ssl/cloudflare:/etc/ssl/cloudflare:ro
    depends_on:
      - spring
    restart: always
    networks:
      - dummytalk-network

  spring:
    image: ${DOCKER_USERNAME}/dummytalk:latest
    container_name: DummyTalk_Spring
    expose: # nginx가 프록시하므로 외부 직접 접근 차단 (같은 container 끼리는 가능)
      - "8080"
    environment:
      # JVM heap 고정 — 컨테이너 기본 heap = 호스트 메모리의 25% 라 인스턴스(t3.small 2GiB → m7g.large 8GiB)에 따라
      # heap 이 달라져 GC 지표가 인스턴스 변수에 오염됨 (m7g.large 실측: 고정 전 max 1.89GiB).
      # -Xms=-Xmx 로 회차 중 heap 리사이즈까지 제거. 값은 .env 의 JAVA_HEAP, 회차 사이엔 바꾸지 않는다.
      # 기본값 2g 인 이유: 8 GiB 중 동거 컴포넌트(ES·PG·Redis·Prometheus·Grafana) 합계가 ~2 GiB 라 여유가 충분하고,
      #   deploy.yml 이 배포마다 .env 를 덮어쓰므로 JAVA_HEAP 재추가를 잊어도 의도한 값으로 뜨게 하기 위함.
      #   (트레이드오프: heap 이 클수록 GC 가 드물어져 3분 회차에서 GC 표본이 적게 잡힐 수 있음 — GC 비교는 별도 회차로)
      # ZGC/Pinning 진단 옵션을 쓸 땐 같은 변수에 이어 붙일 것 (JAVA_TOOL_OPTIONS 는 하나만 유효):
      #   -XX:+UseZGC -XX:+ZGenerational               → VT Continuation(단명 객체) 수거 최적화, STW < 1ms
      #   -Djdk.tracePinnedThreads=full                 → synchronized 내부 블로킹 I/O 로 캐리어가 묶이는 지점 추적
      #   (의심 지점: Redisson 3.18.0 RLock 내부, Hibernate L1 Cache 동기화)
      - JAVA_TOOL_OPTIONS=-Xms${JAVA_HEAP:-2g} -Xmx${JAVA_HEAP:-2g}
      - TEST_LOAD_USERS=true
      # 테스트 유저 시딩 규모 = 본측정 최대 RATE × INTERVAL (600 × 5s = 3000). application.yml test.load-users-count 로 연결, 멱등
      - TEST_LOAD_USERS_COUNT=${TEST_LOAD_USERS_COUNT:-300}
      # 로그 레벨 — 부하 회차에서는 기본값(SQL OFF / 앱 INFO)을 쓰고, 로그 비용 대조 회차에서만 .env 로 올린다.
      # 200rps 실측에서 로그가 초당 3,066건이었고 CPU(system) 가 99% 라 이 비용이 결과를 직접 흔들었다.
      - LOG_LEVEL_SQL=${LOG_LEVEL_SQL:-OFF}
      - LOG_LEVEL_APP=${LOG_LEVEL_APP:-INFO}
      # CP 스윕 실험용 — 셸에서 HIKARI_POOL_SIZE=20 docker compose up -d spring 처럼 값 지정, 미지정 시 10(기존 baseline)
      - HIKARI_POOL_SIZE=${HIKARI_POOL_SIZE:-10}
      - DB_HOST=postgresql
      - DB_NAME=${DB_NAME}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - OPENAI_KEY=${OPENAI_KEY}
      - MAIL_SENDER_HOST=${MAIL_SENDER_HOST}
      - MAIL_SENDER_USERNAME=${MAIL_SENDER_USERNAME}
      - MAIL_SENDER_PASSWORD=${MAIL_SENDER_PASSWORD}
      - ES_URL=http://elasticsearch:9200
      - DISCORD_WEBHOOK=${DISCORD_WEBHOOK}
    volumes:
      # 뱃지 이미지: EC2 /home/ubuntu/data/badges/
      # 컨테이너 /app/uploads/badges/ (read only)
      - /home/ubuntu/data/badges:/app/uploads/badges:ro
    # ES 늦게 켜져서 condition 추가
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    restart: always
    networks:
      - dummytalk-network

  postgresql:
    image: postgres:15-alpine
    container_name: DummyTalk_Postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Seoul
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always
    networks:
      - dummytalk-network

  redis:
    image: redis:7-alpine
    container_name: DummyTalk_Redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: always
    networks:
      - dummytalk-network

  prometheus:
    image: prom/prometheus:latest
    container_name: DummyTalk_Prometheus
    ports:
      - "9090:9090"
    volumes:
      # prometheus.yml -> SCP 로 EC2 ~/dummytalk/docker/ 에 복사
      # docker compose -f docker/docker-compose.yml 실행 시 ./prometheus.yml = docker/prometheus.yml
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    command: --config.file=/etc/prometheus/prometheus.yml
    restart: always
    networks:
      - dummytalk-network

  grafana:
    image: grafana/grafana:latest
    container_name: DummyTalk_Grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      # 프로비저닝 — 데이터소스(Prometheus)·부하테스트 대시보드 자동 로드. SCP 로 EC2 ~/dummytalk/docker/grafana/ 에 복사
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: always
    networks:
      - dummytalk-network

  elasticsearch:
    # Nori 플러그인이 설치된 커스텀 이미지 (docker/Dockerfile-es 로 빌드 후 Docker Hub에 올림)
    # build + image 동시 사용 시 docker compose pull 이 공식 이미지를 덮어쓰는 문제 방지
    image: ${DOCKER_USERNAME}/elasticsearch-nori:8.11.1
    container_name: DummyTalk_ElasticSearch
    environment:
      - node.name=es01
      - cluster.name=dummy-cluster
      - discovery.type=single-node
      - xpack.security.enabled=false
      # 단일 노드 기준 256MB로 돌리기 ( 512MB는 1GB RAM EC2에서 GC 폭주 )
      - "ES_JAVA_OPTS=-Xms256m -Xmx256m"
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health?wait_for_status=yellow || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: always
    networks:
      - dummytalk-network

  kibana:
    # Elasticsearch 와 버전을 반드시 맞춰야 함 (8.x 마이너 불일치 시 연결 실패)
    # profiles: monitoring -> 기본 docker compose up -d 에서 제외, 수동으로만 = 메모리 및 스토리지 부족...
    profiles: ["monitoring"]
    image: docker.elastic.co/kibana/kibana:8.11.1
    container_name: DummyTalk_Kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - dummytalk-network

volumes:
  postgres_data:
  grafana_data:
  redis_data:
  es_data:


networks:
  dummytalk-network:
    driver: bridge