#cloud-config
# ─────────────────────────────────────────────────────────────────────────────
# DummyTalk 측정용 EC2 호스트 부트스트랩 (m7g.large · Ubuntu 24.04 LTS · arm64)
#
# 사용법: EC2 인스턴스 시작 화면 → "고급 세부 정보" → "사용자 데이터" 에 이 파일 내용을 그대로 붙여넣는다.
#         첫 부팅 때 cloud-init 이 한 번 실행하며, 이후 재부팅에서는 다시 돌지 않는다.
#         절차 전체는 infra/ec2/README.md 참고.
#
# 왜 파일로 남기나: 기존 t3.small 은 손으로 셋업해 기록이 없었다. 인스턴스를 바꿀 때(xlarge 대조, Oracle 이관)
#   같은 셋업을 반복해야 하므로 "호스트가 앱을 올릴 수 있는 상태" 의 정의를 레포에 둔다.
#
# 이 파일이 하는 일 (각 항목의 근거는 아래 주석):
#   1. 시간대 Asia/Seoul            — k6 결과 파일명 · Grafana 창 · Postgres TZ 가 같은 시계를 쓰게
#   2. Docker 공식 apt 저장소 설치   — deploy.yml 이 `docker compose`(v2 플러그인) 명령을 전제
#   3. 커널 파라미터                 — Elasticsearch 컨테이너는 vm.max_map_count=262144 없으면 기동 실패
#   4. Docker 로그 로테이션          — 인터셉터가 요청마다 info/warn 로그 → 부하 중 디스크가 차는 것 방지
#   5. 디렉터리                      — deploy.yml scp 대상(~/dummytalk/docker), 뱃지 bind mount, TLS 인증서 경로
#   6. 검증 로그                     — 아치/버전을 /var/log/dummytalk-cloud-init.log 에 남겨 SSH 후 한 번에 확인
#
# 하지 않는 일: 스왑을 만들지 않는다. 8 GiB 에서 스왑이 쓰이기 시작하면 그 회차는 무효이므로
#   "안 보이게 버티는" 대신 free -m 에서 바로 드러나게 둔다. (측정용 인스턴스 전용 판단)
# ─────────────────────────────────────────────────────────────────────────────

timezone: Asia/Seoul

package_update: true
package_upgrade: true

# Docker 저장소 등록에 필요한 최소 패키지 (Docker 공식 문서 절차 그대로)
packages:
  - ca-certificates
  - curl
  - htop          # 회차 중 CPU/메모리 눈으로 확인용
  - jq            # /actuator, Prometheus API 응답 확인용

write_files:
  # 3. 커널 파라미터
  #    vm.max_map_count : Elasticsearch(8.x) 컨테이너 필수 (mmap 영역 수). 없으면 bootstrap check 실패로 ES 가 죽고,
  #                       compose 의 depends_on(service_healthy) 때문에 spring 도 뜨지 않는다.
  #    net.core.somaxconn : 리슨 소켓 accept 큐 상한. 기본 4096(6.x 커널)이지만 명시해 둔다.
  #                       Tomcat 의 accept-count 는 이 값을 넘지 못한다.
  - path: /etc/sysctl.d/99-dummytalk.conf
    permissions: "0644"
    content: |
      vm.max_map_count = 262144
      net.core.somaxconn = 4096

  # 4. Docker 데몬 로그 로테이션 — 컨테이너당 최대 50MB × 3 파일. 부하 회차에서 로그가 수 GB 로 커지는 것을 막는다.
  #    (docker logs 로 최근 150MB 는 여전히 볼 수 있음)
  - path: /etc/docker/daemon.json
    permissions: "0644"
    content: |
      {
        "log-driver": "json-file",
        "log-opts": { "max-size": "50m", "max-file": "3" }
      }

runcmd:
  # 2. Docker 공식 apt 저장소 (https://docs.docker.com/engine/install/ubuntu/ 절차 그대로, arm64/noble 자동 판별)
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - |
    cat > /etc/apt/sources.list.d/docker.sources <<EOF
    Types: deb
    URIs: https://download.docker.com/linux/ubuntu
    Suites: $(. /etc/os-release && echo "${UBUNTU_CODENAME:-$VERSION_CODENAME}")
    Components: stable
    Architectures: $(dpkg --print-architecture)
    Signed-By: /etc/apt/keyrings/docker.asc
    EOF
  - apt-get update
  # docker-compose-plugin = `docker compose` v2 (deploy.yml 이 쓰는 명령). buildx 는 로컬 이미지 빌드가 필요할 때 대비.
  - DEBIAN_FRONTEND=noninteractive apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  - systemctl enable --now docker
  # ubuntu 유저를 docker 그룹에 — deploy.yml 은 sudo docker 라 필수는 아니지만 SSH 수동 점검 시 편의.
  # (cloud-init `users` 모듈은 패키지 설치보다 먼저 돌아 docker 그룹이 아직 없으므로 여기서 처리. 재로그인 후 적용)
  - usermod -aG docker ubuntu

  # 3. 커널 파라미터 즉시 반영 (write_files 는 파일만 놓고 sysctl 은 재부팅 전엔 적용되지 않는다)
  - sysctl --system

  # 5. 디렉터리 — deploy.yml scp 대상 / 뱃지 bind mount / Cloudflare Origin 인증서 자리
  #    인증서 파일 자체는 사용자가 발급받아 /etc/ssl/cloudflare/{cert,key}.pem 으로 배치한다 (README 6단계)
  - mkdir -p /home/ubuntu/dummytalk/docker /home/ubuntu/data/badges /etc/ssl/cloudflare
  - chown -R ubuntu:ubuntu /home/ubuntu/dummytalk /home/ubuntu/data
  - chmod 700 /etc/ssl/cloudflare

  # 6. 검증 로그 — SSH 접속 후 `cat /var/log/dummytalk-cloud-init.log` 한 번으로 확인
  #    기대값: aarch64 / Docker 2x.x / Docker Compose v2.x / vm.max_map_count = 262144
  - |
    {
      echo "== DummyTalk cloud-init done: $(date -Is)"
      echo "arch:      $(uname -m)"
      echo "os:        $(. /etc/os-release && echo "$PRETTY_NAME")"
      echo "docker:    $(docker --version)"
      echo "compose:   $(docker compose version)"
      echo "sysctl:    $(sysctl -n vm.max_map_count) (vm.max_map_count)"
      echo "mem:       $(free -m | awk '/^Mem:/{print $2" MB total"}')"
      echo "swap:      $(free -m | awk '/^Swap:/{print $2" MB (0 이어야 정상)"}')"
      echo "dirs:      $(ls -d /home/ubuntu/dummytalk/docker /home/ubuntu/data/badges /etc/ssl/cloudflare | tr '\n' ' ')"
    } > /var/log/dummytalk-cloud-init.log 2>&1

final_message: "DummyTalk host ready after $UPTIME s — see /var/log/dummytalk-cloud-init.log"
